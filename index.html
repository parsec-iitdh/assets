        h1 {
            text-align: center;
            padding: 20px 0;
            margin: 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            background-color: #ffd500;
            border: 1px solid #ccc;
            padding: 6px;
            box-sizing: border-box;
        }

        .gallery img:hover {
            transform: scale(1.15);
            transition: transform 0.2s ease-in-out;
            z-index: 5;
        }
    </style>
